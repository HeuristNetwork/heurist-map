<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Heurist Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <div id="heurist-map"></div>

  <script>
    // Local/default MapDocument. A public API MapDocument can replace it later
    // through: await window.heuristMap.loadMapDocument(recordId).
    window.heuristMapConfig = {
      format: 'heurist-map-document',
      version: 1,
      id: null,
      title: 'Default map document',
      mapBookmark: {
        raw: '',
        type: 'view',
        center: { latitude: -33.8688, longitude: 151.2093 },
        zoom: 3
      },
      geoObject: null,
      symbology: null,
      minimumZoom: null,
      maximumZoom: null,
      zoomToPointInKM: 5,
      worldBaseMap: {
        id: null,
        code: 'OpenStreetMap',
        label: 'OpenStreetMap'
      },
      crs: {
        id: null,
        code: 'EPSG:3857',
        label: 'Web Mercator'
      },
      layers: []
    };

    window.heuristMapOptions = {
      containerId: 'heurist-map',
      engine: 'leaflet',
      readonly: true,

      // Phase 2 public API configuration. Replace the database before calling
      // loadMapDocument(). apiBaseUrl may also be a complete absolute URL.
      apiBaseUrl: '/heurist/api',
      database: null
    };
  </script>

  <script type="module" src="/src/main.js"></script>

  <script type="module">
    async function getHeuristMap() {
      for (let attempt = 0; attempt < 100; attempt += 1) {
        if (window.heuristMap) {
          await window.heuristMap.ready();
          return window.heuristMap;
        }
        await new Promise((resolve) => setTimeout(resolve, 20));
      }
      throw new Error('Heurist Map API was not initialized');
    }

    try {
      const map = await getHeuristMap();

      // Phase 1/standalone inline layer remains available.
      await map.addLayer({
        id: 'sample-places',
        title: 'Sample places',
        type: 'geojson',
        visible: true,
        data: {
          type: 'FeatureCollection',
          features: [
            {
              type: 'Feature',
              id: 'sydney',
              properties: { name: 'Sydney', recordId: 1 },
              geometry: { type: 'Point', coordinates: [151.2093, -33.8688] }
            },
            {
              type: 'Feature',
              id: 'canberra',
              properties: { name: 'Canberra', recordId: 2 },
              geometry: { type: 'Point', coordinates: [149.1300, -35.2809] }
            }
          ]
        },
        style: {
          color: '#276cb8',
          fillColor: '#4f9de8',
          fillOpacity: 0.45,
          radius: 8
        }
      });

      await map.fitBounds({
        west: 148.8,
        south: -35.8,
        east: 151.8,
        north: -33.3
      });

      // Public API example after setting heuristMapOptions.database:
      // await map.loadMapDocument(123);
    } catch (error) {
      console.error('Cannot initialize sample map content', error);
    }
  </script>
</body>
</html>
